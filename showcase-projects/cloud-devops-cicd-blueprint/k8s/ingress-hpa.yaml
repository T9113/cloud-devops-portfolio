apiVersion: v1
kind: Service
metadata:
  name: cloud-blueprint-service
  namespace: default
  labels:
    app.kubernetes.io/name: cloud-blueprint-app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: cloud-blueprint-app
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-blueprint-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
spec:
  tls:
    - hosts:
        - api.cloudblueprint.dev
      secretName: cloudblueprint-api-tls
  rules:
    - host: api.cloudblueprint.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud-blueprint-service
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloud-blueprint-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloud-blueprint-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
